<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#596593" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Librusek</title>
    <script>
      // Apply the stored theme before React mounts (Capacitor Preferences use this key on web) - avoids a flash
      try {
        const theme = localStorage.getItem("CapacitorStorage.theme");
        if (theme) document.documentElement.setAttribute("data-theme", theme);
      } catch {
        // storage unavailable - default theme
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
